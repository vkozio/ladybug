# Nightly run disabled: workflow was failing at startup (invalid reusable inputs);
# the GDB dispatch test job is disabled (if: false). Use workflow_dispatch to run manually if needed.
name: SimSIMD Dispatch Test
on:
  workflow_dispatch:

jobs:
  build-precompiled-bin-linux:
    uses: ./.github/workflows/precompiled-bin-workflow.yml
    with:
      isNightly: true
    secrets: inherit

  build-extensions-linux:
    uses: ./.github/workflows/build-extensions.yml
    secrets: inherit

  simsimd-dispatch-test:
    name: simsimd-dispatch-test
    needs: [build-precompiled-bin-linux, build-extensions-linux]
    runs-on: lbug-self-hosted-testing
    if: false
    env:
      NUM_THREADS: 32
      GEN: Ninja
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - name: Download nightly build
        uses: actions/download-artifact@v4
        with:
          name: lbug_cli-linux-x86_64

      - name: Download extensions
        uses: actions/download-artifact@v4
        with:
          name: lbug-extensions_linux-x86_64

      - name: Extract artifacts
        run: |
          tar xf lbug_cli-linux-x86_64.tar.gz

      - name: Test
        run: gdb --batch -x scripts/test-simsimd-dispatch.py --args ./lbug
